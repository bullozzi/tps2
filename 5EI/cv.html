
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Convertitore Valute BCE</title>
</head>
<body>

    <h1>Convertitore di valute</h1>

    <label>Quantità:</label>
    <input type="number" id="quantita" value="100" min="0" step="any">

    <br><br>

    <label>Da valuta:</label>
    <select id="valutaPartenza"></select>

    <br><br>

    <label>A valuta:</label>
    <select id="valutaArrivo"></select>

    <br><br>

    <button onclick="converti()">Converti</button>

    <h2 id="risultato"></h2>
    <p id="data"></p>

    <script>
        var tassi = {};
        tassi["EUR"] = 1;

        function caricaXML() {

            var xhr = new XMLHttpRequest();

            xhr.open("GET",
                "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml",
                true);

            xhr.onload = function() {

                if (xhr.status == 200 && xhr.responseXML) {

                    var xml = xhr.responseXML;

                    var elementi = xml.getElementsByTagName("Cube");

                    for (var i = 0; i < elementi.length; i++) {

                        var valuta = elementi[i].getAttribute("currency");
                        var tasso = elementi[i].getAttribute("rate");

                        if (valuta != null && tasso != null) {
                            tassi[valuta] = parseFloat(tasso);
                        }

                        var data = elementi[i].getAttribute("time");

                        if (data != null) {
                            document.getElementById("data").textContent =
                                "Tassi aggiornati al: " + data;
                        }
                    }

                    riempiSelect();

                } else {
                    document.getElementById("risultato").textContent =
                        "Errore nel caricamento del file XML";
                }
            };

            xhr.onerror = function() {
                document.getElementById("risultato").textContent =
                    "Impossibile caricare il file XML";
            };

            xhr.send();
        }

        function riempiSelect() {

            var partenza = document.getElementById("valutaPartenza");
            var arrivo = document.getElementById("valutaArrivo");

            for (var valuta in tassi) {

                var opzione1 = document.createElement("option");
                opzione1.value = valuta;
                opzione1.textContent = valuta;
                partenza.appendChild(opzione1);

                var opzione2 = document.createElement("option");
                opzione2.value = valuta;
                opzione2.textContent = valuta;
                arrivo.appendChild(opzione2);
            }

            partenza.value = "EUR";
            arrivo.value = "USD";
        }

        function converti() {

            var quantita = parseFloat(
                document.getElementById("quantita").value
            );

            var da = document.getElementById("valutaPartenza").value;
            var a = document.getElementById("valutaArrivo").value;

            if (!Number.isFinite(quantita) || quantita < 0) {
                document.getElementById("risultato").textContent =
                    "Inserisci una quantità valida";
                return;
            }

            if (tassi[da] == null || tassi[a] == null) {
                document.getElementById("risultato").textContent =
                    "Tassi di cambio non disponibili";
                return;
            }

            var risultato = quantita / tassi[da] * tassi[a];

            document.getElementById("risultato").textContent =
                quantita + " " + da + " = " +
                risultato.toFixed(2) + " " + a;
        }

        window.onload = caricaXML;
    </script>

</body>
</html>
