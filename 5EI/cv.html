<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Convertitore Valute</title>
    <style>
        html {
            min-height: 100%;
            background: linear-gradient(135deg, #1e3c72, #2a5298 55%, #4b79c9);
        }

        body {
            max-width: 420px;
            margin: 60px auto;
            padding: 32px 30px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
            color: #25324a;
            box-sizing: border-box;
        }

        br {
            display: none;
        }

        h2 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 1.7rem;
            color: #1e3c72;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #5a6b8c;
        }

        input,
        select {
            width: 100%;
            margin-bottom: 20px;
            padding: 12px 14px;
            border: 2px solid #dbe3f1;
            border-radius: 10px;
            background: #f7f9fd;
            font-size: 1rem;
            color: #25324a;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2a5298;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2a5298, #4b79c9);
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(42, 82, 152, 0.4);
        }

        button:active {
            transform: translateY(0);
            box-shadow: none;
        }

        #risultato {
            margin: 24px 0 0;
            padding: 0;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 600;
            color: #1e3c72;
            line-height: 1.4;
        }

        #risultato:not(:empty) {
            padding: 16px;
            background: #eef3fc;
            border-left: 5px solid #2a5298;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h2>Convertitore in Euro</h2>

    <label for="quantita">Quanto vuoi convertire?</label>
    <input type="number" id="quantita" placeholder="Es. 50" min="0" step="any">
    <br><br>

    <label for="divisa">Da quale valuta?</label>
    <select id="divisa">
        <option value="USD">Dollari USA (USD)</option>
        <option value="JPY">Yen Giapponesi (JPY)</option>
        <option value="GBP">Sterline Inglesi (GBP)</option>
        <option value="CHF">Franchi Svizzeri (CHF)</option>
    </select>
    <br><br>

    <button onclick="converti()">Calcola valore in Euro</button>

    <h3 id="risultato"></h3>

    <script>
        const TASSI_RISERVA = { USD: 0.86, JPY: 0.0057, GBP: 1.15, CHF: 1.07 };

        async function fetchConTimeout(url, ms = 8000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), ms);
            try {
                return await fetch(url, { signal: controller.signal });
            } finally {
                clearTimeout(timer);
            }
        }

        const FONTI = [
            async d => {
                const r = await fetchConTimeout("https://api.frankfurter.dev/v1/latest?base=" + d + "&symbols=EUR");
                if (!r.ok) throw new Error("HTTP " + r.status);
                const j = await r.json();
                return { tasso: j.rates.EUR, data: j.date };
            },
            async d => {
                const r = await fetchConTimeout("https://open.er-api.com/v6/latest/" + d);
                if (!r.ok) throw new Error("HTTP " + r.status);
                const j = await r.json();
                return { tasso: j.rates.EUR, data: (j.time_last_update_utc || "").slice(5, 16) };
            },
            async d => {
                const c = d.toLowerCase();
                const r = await fetchConTimeout("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/" + c + ".json");
                if (!r.ok) throw new Error("HTTP " + r.status);
                const j = await r.json();
                return { tasso: j[c].eur, data: j.date };
            },
            async d => {
                const url = "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml";
                const r = await fetchConTimeout("https://corsproxy.io/?" + encodeURIComponent(url));
                if (!r.ok) throw new Error("HTTP " + r.status);
                const xml = new DOMParser().parseFromString(await r.text(), "text/xml");
                const celle = xml.getElementsByTagName("Cube");
                let data = "";
                for (let i = 0; i < celle.length; i++) {
                    if (celle[i].getAttribute("time")) data = celle[i].getAttribute("time");
                    if (celle[i].getAttribute("currency") === d) {
                        return { tasso: 1 / parseFloat(celle[i].getAttribute("rate")), data: data };
                    }
                }
                throw new Error("valuta non trovata");
            }
        ];

        async function ottieniTasso(divisa) {
            for (let i = 0; i < FONTI.length; i++) {
                try {
                    const esito = await FONTI[i](divisa);
                    if (esito.tasso && isFinite(esito.tasso)) return esito;
                } catch (e) {
                    console.warn("Fonte " + (i + 1) + " fallita:", e.message);
                }
            }
            return { tasso: TASSI_RISERVA[divisa], data: null, riserva: true };
        }

        async function converti() {
            const risultato = document.getElementById("risultato");
            const importo = parseFloat(document.getElementById("quantita").value);
            const divisaScelta = document.getElementById("divisa").value;

            if (isNaN(importo) || importo < 0) {
                risultato.textContent = "Inserisci un importo valido.";
                return;
            }

            risultato.textContent = "Calcolo in corso...";

            const { tasso, data, riserva } = await ottieniTasso(divisaScelta);
            const totale = importo * tasso;

            let testo = importo + " " + divisaScelta + " valgono " + totale.toFixed(2) + " EUR";
            if (riserva) {
                testo += " (valore approssimativo: tassi online non raggiungibili)";
            } else if (data) {
                testo += " (tasso del " + data + ")";
            }
            risultato.textContent = testo;
        }
    </script>

</body>
</html>
