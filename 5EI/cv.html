<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Convertitore Valute</title>
</head>
<body>

    <h1>Convertitore di valute in Euro</h1>

    <label>Inserisci la quantità:</label>
    <input type="number" id="quantita" min="0" step="any">

    <br><br>

    <label>Seleziona la divisa:</label>
    <select id="divisa">
        <option value="USD">Dollaro americano</option>
        <option value="GBP">Sterlina inglese</option>
        <option value="JPY">Yen giapponese</option>
        <option value="CHF">Franco svizzero</option>
        <option value="CAD">Dollaro canadese</option>
        <option value="AUD">Dollaro australiano</option>
    </select>

    <br><br>

    <button onclick="converti()">Converti in Euro</button>

    <h2 id="risultato"></h2>

    <script>

        function converti() {

            var quantita = document.getElementById("quantita").value;
            var divisa = document.getElementById("divisa").value;
            var output = document.getElementById("risultato");

            if (quantita == "" || quantita < 0) {
                output.innerHTML = "Inserisci una quantità valida";
                return;
            }

            var xhr = new XMLHttpRequest();

            xhr.open("GET", "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml", true);

            xhr.overrideMimeType("application/xml");

            xhr.onload = function() {

                if (xhr.status == 200 && xhr.responseXML != null) {

                    var xml = xhr.responseXML;
                    var dati = xml.getElementsByTagName("Cube");

                    for (var i = 0; i < dati.length; i++) {

                        if (dati[i].getAttribute("currency") == divisa) {

                            var tasso = dati[i].getAttribute("rate");
                            var risultato = quantita / tasso;

                            output.innerHTML = quantita + " " + divisa +
                                " = " + risultato.toFixed(2) + " €";

                            return;
                        }
                    }

                    output.innerHTML = "Valuta non trovata";

                } else {
                    output.innerHTML = "Errore nella lettura XML";
                }
            };

            xhr.onerror = function() {
                output.innerHTML = "Accesso al server BCE non riuscito";
            };

            xhr.send();
        }

    </script>

</body>
</html>
