<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertitore Valute</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 420px;
        }

        .simbolo {
            background-color: #eff6ff;
            color: #2563eb;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            margin-bottom: 22px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            font-size: 16px;
            color: #1e293b;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }

        #risultato {
            text-align: center;
            color: #15803d;
            background-color: #f0fdf4;
            padding: 18px;
            border-radius: 8px;
            font-size: 18px;
            margin-top: 25px;
        }

        #risultato:empty {
            display: none;
        }

        .fonte {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="simbolo">€</div>

        <h2>Convertitore in Euro</h2>

        <p>Converti le principali valute internazionali in euro.</p>

        <label for="quantita">Quanto vuoi convertire?</label>
        <input type="number" id="quantita" placeholder="Es. 50">

        <label for="divisa">Da quale valuta?</label>
        <select id="divisa">
            <option value="USD">Dollari USA (USD)</option>
            <option value="JPY">Yen Giapponesi (JPY)</option>
            <option value="GBP">Sterline Inglesi (GBP)</option>
            <option value="CHF">Franchi Svizzeri (CHF)</option>
        </select>

        <button onclick="converti()">Calcola valore in Euro</button>

        <h3 id="risultato"></h3>

        <div class="fonte">
            Tassi di cambio della Banca Centrale Europea
        </div>

    </div>

    <script>
        function converti() {
            var importo = document.getElementById("quantita").value;
            var divisaScelta = document.getElementById("divisa").value;

            var xhttp = new XMLHttpRequest();
            xhttp.open("GET", "https://proxy.cors.dev/https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml", false);
            xhttp.send();

            var xml = xhttp.responseXML;
            var righe = xml.getElementsByTagName("Cube");

            for (var i = 2; i < righe.length; i++) {
                var valuta = righe[i].attributes[0].value;
                var tasso = righe[i].attributes[1].value;

                if (valuta == divisaScelta) {
                    var totale = importo / tasso;
                    document.getElementById("risultato").innerHTML =
                        importo + " " + divisaScelta + " valgono " + totale + " EUR";
                }
            }
        }
    </script>

</body>
</html>
