<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertitore di valute – cambi BCE</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --txt:#1c2430; --muted:#5d6b7e; --accent:#0b4ea2; --line:#d9dfe8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b212a; --txt:#e8edf3; --muted:#9aa7b8; --accent:#6fa8ff; --line:#2b3441; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  main { max-width:560px; margin:40px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.9rem; margin:0 0 20px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  input, select { width:100%; padding:10px; font-size:1rem; border:1px solid var(--line);
                  border-radius:8px; background:var(--bg); color:var(--txt); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  button { margin-top:18px; width:100%; padding:12px; font-size:1rem; border:0; border-radius:8px;
           background:var(--accent); color:#fff; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:#0b1220; } }
  .result { margin-top:22px; padding:16px; border-radius:8px; border:1px solid var(--line); }
  .result .big { font-size:1.6rem; font-weight:600; }
  .result .small { color:var(--muted); font-size:.9rem; margin-top:6px; }
  .error { margin-top:18px; padding:12px; border-radius:8px; border:1px solid #c0392b; color:#c0392b; }
  .hidden { display:none; }
  .fallback { margin-top:18px; font-size:.9rem; color:var(--muted); }
  .fallback a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Convertitore di valute</h1>
    <p class="sub" id="sub">Caricamento dei tassi BCE…</p>

    <div id="fallback" class="fallback hidden">
      Il browser non ha potuto scaricare il file dalla BCE (blocco CORS).
      Scaricalo da <a href="http://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml" target="_blank" rel="noopener">questo link</a>
      e selezionalo qui:
      <input type="file" id="file" accept=".xml,text/xml" style="margin-top:8px">
    </div>

    <div id="app" class="hidden">
      <label for="importo">Quantità</label>
      <input id="importo" value="1" inputmode="decimal">
      <div class="row">
        <div>
          <label for="da">Da (divisa da convertire)</label>
          <select id="da"></select>
        </div>
        <div>
          <label for="a">A</label>
          <select id="a"></select>
        </div>
      </div>
      <button id="converti">Converti</button>
    </div>

    <div id="out"></div>
  </div>
</main>

<script>
const URL_BCE = 'https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml';
let cambi = {};

const $ = id => document.getElementById(id);

// Legge il testo del file e ne estrae data e tassi (nessun parser XML)
function leggiTesto(testo) {
  const d = testo.match(/<Cube\s+time=['"]([\d-]+)['"]/);
  const data = d ? d[1] : '';

  const nuovi = { EUR: 1 }; // la BCE quota tutto rispetto all'euro
  const re = /<Cube\s+currency=['"]([A-Z]{3})['"]\s+rate=['"]([\d.]+)['"]/g;
  let m;
  while ((m = re.exec(testo)) !== null) nuovi[m[1]] = parseFloat(m[2]);

  if (Object.keys(nuovi).length < 2) throw new Error('Nessun tasso trovato nel file.');
  cambi = nuovi;

  const codici = Object.keys(cambi).sort();
  const opz = sel => codici.map(c => `<option value="${c}"${c === sel ? ' selected' : ''}>${c}</option>`).join('');
  $('da').innerHTML = opz('USD');
  $('a').innerHTML = opz('EUR');

  $('sub').textContent = 'Tassi di riferimento BCE' + (data ? ' del ' + data.split('-').reverse().join('/') : '');
  $('app').classList.remove('hidden');
  $('fallback').classList.add('hidden');
}

function mostraErrore(msg) {
  $('out').innerHTML = '';
  const div = document.createElement('div');
  div.className = 'error';
  div.textContent = msg;
  $('out').appendChild(div);
}

function converti() {
  const importo = parseFloat($('importo').value.trim().replace(',', '.'));
  if (isNaN(importo) || importo < 0) return mostraErrore('Inserire un importo numerico valido.');

  const da = $('da').value, a = $('a').value;
  const valore = importo / cambi[da] * cambi[a];
  const tasso = cambi[a] / cambi[da];
  const f2 = n => n.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const f6 = n => n.toLocaleString('it-IT', { minimumFractionDigits: 6, maximumFractionDigits: 6 });

  $('out').innerHTML = `
    <div class="result">
      <div>${f2(importo)} ${da} =</div>
      <div class="big">${f2(valore)} ${a}</div>
      <div class="small">1 ${da} = ${f6(tasso)} ${a}</div>
    </div>`;
}

$('converti').addEventListener('click', converti);
$('importo').addEventListener('keydown', e => { if (e.key === 'Enter') converti(); });

$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { leggiTesto(r.result); } catch (err) { mostraErrore(err.message); }
  };
  r.readAsText(f);
});

// Tentativo di lettura diretta dal sito della BCE
fetch(URL_BCE)
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(leggiTesto)
  .catch(() => {
    $('sub').textContent = 'Tassi BCE non disponibili automaticamente';
    $('fallback').classList.remove('hidden');
  });
</script>
</body>
</html>
